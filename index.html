<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Best Practice EDU66-492</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar + tabs; evaluate view = student rail (left) + scoring sheet (right), stacks on phones */
:root{
  --bg:#f6f5f8; --surface:#ffffff; --sunken:#efedf3; --line:#dedae6;
  --fg:#1f1b2a; --muted:#6b6579; --accent:#5b2a86; --accent-soft:#ece3f5; --on-accent:#ffffff;
  --gold:#b7791f; --gold-soft:#fbf1dc;
  --ok:#2f7d4f; --ok-soft:#e1f2e7; --warn:#a15c07; --warn-soft:#fcefd9; --bad:#b4363b; --bad-soft:#f9e1e2;
  --display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16131c; --surface:#1f1b27; --sunken:#272231; --line:#363042;
  --fg:#ece8f3; --muted:#a59fb3; --accent:#c49be8; --accent-soft:#33264a; --on-accent:#1a1324;
  --gold:#e3b25e; --gold-soft:#3a2e18;
  --ok:#7bcf9a; --ok-soft:#1d3426; --warn:#e8b05a; --warn-soft:#3a2b14; --bad:#ee8a8e; --bad-soft:#3d1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16131c; --surface:#1f1b27; --sunken:#272231; --line:#363042;
  --fg:#ece8f3; --muted:#a59fb3; --accent:#c49be8; --accent-soft:#33264a; --on-accent:#1a1324;
  --gold:#e3b25e; --gold-soft:#3a2e18;
  --ok:#7bcf9a; --ok-soft:#1d3426; --warn:#e8b05a; --warn-soft:#3a2b14; --bad:#ee8a8e; --bad-soft:#3d1f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand h1{font-size:19px;color:var(--accent)}
.brand small{color:var(--muted);font-size:12.5px}
.who{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:999px;max-width:100%;min-width:0}
.who img{width:28px;height:28px;border-radius:50%}
.who .wn{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.who .wn b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .wn span{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.role{font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:8px 14px 10px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

main{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:18px 48px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;max-width:640px;margin:24px auto;display:flex;flex-direction:column;gap:10px}
.notice h2{font-size:19px}
.notice p{margin:0;color:var(--muted)}
.notice code{background:var(--sunken);padding:1px 6px;border-radius:5px;font-size:13px}

/* evaluate */
.eval{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:sticky;top:120px;max-height:calc(100vh - 140px);display:flex;flex-direction:column}
.rail-h{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rail-h input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.rail-h .prog{font-size:12.5px;color:var(--muted)}
.rail ul{list-style:none;margin:0;padding:4px;overflow:auto}
.rail li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}
.rail li button:hover{background:var(--sunken)}
.rail li button[aria-current="true"]{background:var(--accent-soft)}
.rail .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .sid{font-size:12px;color:var(--muted)}
.dots{display:flex;gap:4px;grid-row:span 2}
.dot{width:20px;height:20px;border-radius:5px;font-size:11px;font-weight:600;display:grid;place-items:center;background:var(--sunken);color:var(--muted)}
.dot.done{background:var(--ok-soft);color:var(--ok)}
.dot.part{background:var(--warn-soft);color:var(--warn)}
.dot.na{opacity:.35}

.sheet{display:flex;flex-direction:column;gap:14px;min-width:0}
.sheet-h{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sheet-h h2{font-size:22px}
.sheet-h .meta{color:var(--muted);font-size:13px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.seg .n{font-family:var(--display);font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.scale-note{font-size:12.5px;color:var(--muted);padding:12px 18px;border-bottom:1px solid var(--line)}
.sec-title{font-family:var(--display);font-weight:600;font-size:15px;padding:12px 18px;background:var(--sunken);border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:6px 12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:center}
.item:last-child{border-bottom:0}
.item .no{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.item .tx{font-size:14.5px}
.item .desc{grid-column:2/4;font-size:13px;color:var(--muted);background:var(--sunken);border-radius:7px;padding:6px 10px}
.pick{display:flex;gap:4px}
.pick button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-variant-numeric:tabular-nums}
.pick button:hover{border-color:var(--accent)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pick button[aria-pressed="true"].lo{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px;padding:14px 18px}
.field label{font-size:13px;font-weight:600}
.field input,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.field textarea{min-height:84px;resize:vertical}
.field .hint{font-size:12.5px;color:var(--bad)}

.totalbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 -6px 18px rgba(20,10,40,.06)}
.big{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.big small{font-size:14px;color:var(--muted);font-weight:500}
.lvl{padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--sunken);color:var(--muted)}
.lvl.l5{background:var(--ok-soft);color:var(--ok)} .lvl.l4{background:var(--accent-soft);color:var(--accent)}
.lvl.l3{background:var(--gold-soft);color:var(--gold)} .lvl.l2,.lvl.l1{background:var(--bad-soft);color:var(--bad)}
.save-state{margin-left:auto;font-size:13px;color:var(--muted)}
.save-state.err{color:var(--bad)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);padding:8px 16px;border-radius:8px;font-weight:600}
.btn.ghost{background:none;color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* summary */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunken);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar h2{font-size:18px;margin-right:auto}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
thead th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--sunken);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.c,th.c{text-align:center}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;padding:4px 6px;border-radius:7px;min-width:96px}
button.cell:hover{background:var(--sunken)}
.cell .s{font-variant-numeric:tabular-nums;font-weight:600}
.cell .n{font-size:11.5px;color:var(--muted)}
.muted{color:var(--muted)}
.chk{width:20px;height:20px;accent-color:var(--accent)}

.detail{margin-top:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.detail h3{font-size:16px}
.detail .row{display:grid;grid-template-columns:minmax(140px,220px) 90px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
@media (max-width:640px){.detail .row{grid-template-columns:1fr auto}.detail .row .cm{grid-column:1/-1}}

/* settings */
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:start}
.panel{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:17px}
.panel p{margin:0;font-size:13.5px;color:var(--muted)}
.lect{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1.2fr);gap:8px;align-items:center}
.lect input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-width:0}
.lect .ix{font-family:var(--display);font-weight:700;color:var(--muted)}
.linkst{grid-column:2/4;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.finder{padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:200px;max-width:100%}
.linkst select{padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);max-width:100%}
.tag{font-size:12px;padding:1px 8px;border-radius:999px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.wait{background:var(--sunken);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20}

@media (max-width:900px){
  .eval,.grid2{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:300px}
}
@media (max-width:560px){
  .item{grid-template-columns:24px minmax(0,1fr)}
  .pick{grid-column:2/3}
  .item .desc{grid-column:1/-1}
  .pick button{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html{color-scheme:light} body{margin:0} [hidden]{display:none!important}
</style>
</head>

  <div class="top-in">
    <div class="top-row">
      <div class="brand">
        <h1>ประเมิน Best Practice นักศึกษาฝึกประสบการณ์วิชาชีพครู</h1>

const $ = s=>document.querySelector(s);
const el=(tag,attrs={},...kids)=>{const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){ if(v==null||v===false) continue;
    if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="text") e.textContent=v; else e.setAttribute(k,v===true?"":v);}
  for(const k of kids.flat()){ if(k==null||k===false) continue; e.append(k instanceof Node?k:document.createTextNode(String(k))); }
  return e;};
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600);}
function errMsg(e){const m=(e&&(e.message||e.code))||"";
  const map={committee_full:"ที่นั่งผู้ประเมินครบ 5 ท่านแล้ว",not_admin:"เฉพาะผู้ดูแลระบบ",user_not_found:"ยังไม่พบบัญชีนี้ ผู้ใช้ต้องเข้าสู่ระบบด้วย Google อย่างน้อยหนึ่งครั้งก่อน",google_required:"ต้องเข้าสู่ระบบด้วยบัญชี Google",name_required:"กรุณากรอกชื่อ"};
  for(const k in map) if(m.includes(k)) return map[k]; return m||"เกิดข้อผิดพลาด";}

/* ---------- scoring ---------- */
function getRow(uid,sid,key){return ((S.scores[uid]||{})[sid]||{})[key]||null;}
function dimResult(row,key){
  const d=DIM[key]; const s=(row&&row.s)||[];
  let filled=0,total=0; for(let i=0;i<d.count;i++){const v=s[i]; if(typeof v==="number"){filled++;total+=v;}}
  const complete=filled===d.count; const needsComment=s.some(v=>v===1)&&!(row&&row.note&&row.note.trim());
  return {filled,total,complete,needsComment,done:complete&&!needsComment};
}
function levelOf(key,total){const c=DIM[key].cut;for(let i=0;i<c.length;i++) if(total>=c[i]) return {name:LEVELS[i],cls:"l"+(5-i)};return {name:LEVELS[4],cls:"l1"};}
function isSubmitted(sid,key){return !!(S.submitted[sid]&&S.submitted[sid][key]);}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(2);}

async function start(){
  $("#signout").onclick=async()=>{await sb.auth.signOut(); location.reload();};
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return renderLogin();
  S.user=session.user;
  if((S.user.app_metadata||{}).provider!=="google"){ await sb.auth.signOut(); return renderLogin("กรุณาเข้าสู่ระบบด้วยบัญชี Google"); }
  renderWho();
  const {data:isAdmin}=await sb.rpc("claim_admin"); S.isAdmin=!!isAdmin;
  await loadAll();
}
function renderLogin(msg){
  $("#who").hidden=true; $("#tabs").replaceChildren();
  $("#app").replaceChildren(el("div",{class:"notice"},
    el("h2",{text:"เข้าสู่ระบบ"}),

    msg?el("p",{class:"hint",style:"color:var(--bad)",text:msg}):null,
    el("div",{},el("button",{class:"btn",id:"glogin",onclick:async()=>{
      const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:"select_account"}}});
      if(error) toast(errMsg(error));}},"เข้าสู่ระบบด้วย Google"))));
}

async function adminRpc(fn,args,ok){const {error}=await sb.rpc(fn,args); if(error) return toast(errMsg(error)); toast(ok); loadAll();}
async function setSubmitted(ids,keys,val){
  const rows=[]; ids.forEach(id=>keys.forEach(k=>{(S.submitted[id]??={})[k]=val; rows.push({student_id:id,domain:k,submitted:val,updated_at:new Date().toISOString(),updated_by:S.user.id});}));
  render();
  const {error}=await sb.from("submissions").upsert(rows,{onConflict:"student_id,domain"});
  if(error){toast(errMsg(error)); loadAll();}
}
